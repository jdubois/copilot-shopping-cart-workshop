name: Shopping-cart checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run all activated tests
        run: ./mvnw -q test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: target/surefire-reports
  reference-contracts:
    if: github.repository == 'jdubois/copilot-shopping-cart-workshop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact red and green reference checkpoints
        run: python3 tools/verify-checkpoints.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-receipts
          path: target/checkpoint-checks
