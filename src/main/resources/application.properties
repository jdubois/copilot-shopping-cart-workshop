spring.application.name=shopping-cart
spring.jackson.deserialization.accept-float-as-int=false
spring.profiles.active=local
server.address=127.0.0.1
server.port=18765
spring.datasource.url=jdbc:h2:mem:cart-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=OFF
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF
server.error.include-message=never
server.error.include-stacktrace=never
bootui.mcp.enabled=ON
bootui.read-only=false
bootui.expose-values=MASKED
workshop.revision=${WORKSHOP_REVISION:unrecorded}
